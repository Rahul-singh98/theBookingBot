version: '3'

services:
  userinterface:
    build: userinterface
    ports:
      - "3000:3000"
    networks:
      - frontend
    environment:
      - VITE_CHATBOT_SERVICE=http://nginx/api/chatbot
      - VITE_AUTH_API_URL=http://nginx/api/auth
    # depends_on:
    #   - nginx

  main_db:
    image: mysql:8.0.28
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    env_file:
      - ./secrets/db_secrets.env
    secrets:
      - mysql_root_password
      - mysql_password
      - mysql_configs
    expose:
      - 3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  auth:
    build: 
      context: ./authMicroservice
      dockerfile: Dockerfile
    expose:
      - 8000
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@main_db:3306/${MYSQL_DATABASE}
    env_file:
      - ./secrets/auth_secrets.env
    depends_on:
      main_db:
        condition: service_healthy
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    secrets:
      - auth_secrets
    networks:
      - backend
    # network_mode: "none"

  chatbot:
    build: 
      context: ./chatbotMicroservice
      dockerfile: Dockerfile
    expose:
      - 8000
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@main_db:3306/${MYSQL_DATABASE}
    env_file:
      - ./secrets/chatbot_secrets.env
    depends_on:
      main_db:
        condition: service_healthy
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    secrets:
      - chatbot_secrets
    networks:
      - backend
    # network_mode: "none"

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - userinterface
      - chatbot
      - auth

networks:
  backend:
    driver: bridge

  frontend:
    driver: bridge

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_user_password.txt
  mysql_configs:
    file: ./secrets/db_secrets.env
  auth_secrets:
    file: ./secrets/auth_secrets.env
  chatbot_secrets:
    file: ./secrets/chatbot_secrets.env