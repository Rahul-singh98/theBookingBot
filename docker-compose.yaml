services:
  userinterface:
    build: userinterface
    ports:
      - "${UI_PORT:-3000}:3000"
    networks:
      - app_network
    environment:
      - VITE_AUTH_API_URL=${AUTH_PUBLIC_URL:-http://localhost:8000}
      - VITE_CHATBOT_API_URL=${CHATBOT_PUBLIC_URL:-http://localhost:8001}

  auth:
    build: authMicroservice
    ports:
      - "${AUTH_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@main_db:3306/${DB_NAME:-chatbot_db}
      - SECRET_KEY=${SECRET_KEY:-rcGxdzPSCGSGnmlfkjydATFgVqehWBRNkQnmdJbUQTYxRxrlZG}
      - ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE:-30}
      - ADMIN_GROUP_NAME=${ADMIN_GROUP:-admin}
      - STAFF_GROUP_NAME=${STAFF_GROUP:-staff}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALLOWED_METHODS=${ALLOWED_METHODS:-*}
      - ALLOWED_HEADERS=${ALLOWED_HEADERS:-*}
      - CREATE_SUPER_ADMIN=${CREATE_SUPER_ADMIN:-true}
      - SUPER_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@authentication.com}
      - SUPER_ADMIN_USERNAME=${ADMIN_USERNAME:-super_admin}
      - SUPER_ADMIN_PASSWORD=${ADMIN_PASSWORD:-#Admin@1234}
      - SUPER_ADMIN_FIRST_NAME=${ADMIN_FIRST_NAME:-Super}
      - SUPER_ADMIN_LAST_NAME=${ADMIN_LAST_NAME:-Admin}
      - BASE_URL=${AUTH_INTERNAL_URL:-http://auth:8000}
    depends_on:
      main_db:
        condition: service_healthy
    networks:
      - app_network

  chatbot:
    build: chatbotMicroservice
    ports:
      - "${CHATBOT_PORT:-8001}:8000"
    environment:
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@main_db:3306/${DB_NAME:-chatbot_db}
      - AUTH_SERVICE_URL=${AUTH_INTERNAL_URL:-http://auth:8000}
      - BASE_URL=${CHATBOT_INTERNAL_URL:-http://chatbot:8000}
    depends_on:
      main_db:
        condition: service_healthy
    networks:
      - app_network

  main_db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-chatbot_db}
      - MYSQL_USER=${DB_USER:-user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    expose:
      - 3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app_network
    depends_on:
      - userinterface
      - chatbot
      - auth

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data: