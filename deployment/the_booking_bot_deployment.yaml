AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template to create an EC2 instance with Docker Compose and Key Pair.

Parameters:
  EC2KeyPairName:
    Type: String
    Description: Key pair used to connect to the EC2 instance via SSH
    Default: the-booking-bot-ec2-keypair

  GithubPersonalAccessToken:
    Type: String
    Description: GitHub Personal Access Token (PAT) to clone the repository
    NoEcho: true # Hide the value in CloudFormation logs for security

Resources:
  # Security Group for the EC2 instance
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH and HTTP access to the EC2 instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # Open to all (restrict for production)

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # Open to all (restrict for production)

  # EC2 Instance with Docker and Docker Compose installed
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.micro
      KeyName: !Ref EC2KeyPairName
      ImageId: ami-0c8eea98010057bd0
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          # Replace these variables with your values
          domains=(chatbot.stack-it.tech)
          email="admin@stack-it.tech" # Adding a valid address is strongly recommended
          staging=0                   # Set to 1 if you're testing your setup to avoid hitting request limits

          # Create directories for certbot
          mkdir -p certbot/www
          mkdir -p certbot/conf

          cd /home/ec2-user/theBookingBot

          # Create temporary nginx config
          cat >nginx.conf <<EOF
          events {
              worker_connections 1024;
          }

          http {
              # Basic settings
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              types_hash_max_size 2048;
              server_tokens off;

              # MIME types
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              # SSL Settings
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;
              ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;

              # Main server block
              server {
                  listen 80;
                  listen [::]:80;
                  server_name ${DOMAIN_NAME};

                  # Redirect HTTP to HTTPS
                  location / {
                      return 301 https://$server_name$request_uri;
                  }
              }

              server {
                  listen 443 ssl http2;
                  listen [::]:443 ssl http2;
                  server_name ${DOMAIN_NAME};

                  # SSL certificate paths
                  ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
                  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

                  # Security headers
                  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                  add_header X-Frame-Options SAMEORIGIN;
                  add_header X-Content-Type-Options nosniff;
                  add_header X-XSS-Protection "1; mode=block";

                  # React frontend
                  location / {
                      proxy_pass http://userinterface:3000;
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection 'upgrade';
                      proxy_set_header Host $host;
                      proxy_cache_bypass $http_upgrade;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Auth service
                  location /api/auth {
                      proxy_pass http://auth:8000/api/auth;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Chatbot service
                  location /api/chatbot {
                      proxy_pass http://chatbot:8001/api/chatbots;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Chats service
                  location /api/chats {
                      proxy_pass http://chatbot:8001/api/chats;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Questions service
                  location /api/questions {
                      proxy_pass http://chatbot:8001/api/questions;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Static files
                  location /static {
                      proxy_pass http://chatbot:8000/static;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }
          }
          EOF

          sudo docker-compose up --build -d -f prod-docker-compose.yaml

          # Get certificates
          if [ $staging != "0" ]; then
              staging_arg="--staging"
          fi

          for domain in "${domains[@]}"; do
              docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
                  $staging_arg \
                  --email $email \
                  -d $domain \
                  --rsa-key-size 4096 \
                  --agree-tos \
                  --force-renewal
          done

Outputs:
  KeyPairName:
    Description: Name of the Key Pair created
    Value: !Ref EC2KeyPairName

  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref EC2Instance

  InstancePublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  InstancePublicDNS:
    Description: Public DNS of the EC2 instance
    Value: !GetAtt EC2Instance.PublicDnsName
