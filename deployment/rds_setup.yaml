AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template to create an Amazon RDS instance with all necessary configurations

Parameters:
  DBName:
    Description: The name of the database to be created in the RDS instance.
    Type: String
    Default: chatbot_db

  DBUsername:
    Description: The master username for the database.
    Type: String
    Default: admin

  DBPassword:
    Description: The password for the master database user. Must be at least 8 characters long.
    Type: String
    NoEcho: true
    MinLength: 8

  DBInstanceClass:
    Description: The instance class for the RDS instance, which defines CPU and memory capacity.
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
    ConstraintDescription: must be a valid RDS instance class.

  AllocatedStorage:
    Description: The amount of storage (in GB) to be allocated for the RDS instance.
    Type: Number
    Default: 10
    MinValue: 5
    MaxValue: 6144

  MultiAZ:
    Description: Enable Multi-AZ deployment for high availability. Choose "true" to enable or "false" to disable.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false

  Engine:
    Description: The database engine for the RDS instance.
    Type: String
    Default: mysql
    AllowedValues:
      - mysql
      - postgres
      - mariadb
      - oracle-se2
      - sqlserver-ex
      - sqlserver-web
      - sqlserver-se
      - sqlserver-ee
    ConstraintDescription: must be a valid database engine.

  VpcId:
    Description: The ID of the VPC in which to launch the RDS instance.
    Type: AWS::EC2::VPC::Id
    Default: vpc-02299f2e32ea097f3

  SubnetIds:
    Description: A comma-separated list of Subnet IDs within the specified VPC, used for the RDS Subnet Group.
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0c30ea84f6f73cb94, subnet-05125d0a6ee5569ee, subnet-0b37d20a314d05210

Resources:
  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Subnet group for RDS instance"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: my-rds-subnet-group

  MyDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for the RDS instance, allowing database traffic"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0 # Adjust for your requirements
      Tags:
        - Key: Name
          Value: my-rds-security-group

  MyDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: MyRDSInstance
      DBName: !Ref DBName
      AllocatedStorage: !Ref AllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      Engine: !Ref Engine
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VPCSecurityGroups:
        - !Ref MyDBSecurityGroup
      MultiAZ: !Ref MultiAZ
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: my-rds-instance

Outputs:
  DBInstanceEndpoint:
    Description: The connection endpoint for the RDS instance
    Value: !GetAtt MyDBInstance.Endpoint.Address
    Export:
      Name: MyDBInstanceEndpoint

  DBInstancePort:
    Description: The port number on which the RDS database accepts connections
    Value: !GetAtt MyDBInstance.Endpoint.Port
    Export:
      Name: MyDBInstancePort
