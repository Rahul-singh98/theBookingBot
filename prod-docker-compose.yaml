services:
  userinterface:
    build: userinterface
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - VITE_AUTH_API_URL=https://${DOMAIN_NAME}/api/auth
      - VITE_CHATBOT_API_URL=https://${DOMAIN_NAME}/api/chatbot

  auth:
    build: authMicroservice
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://user:${DB_PASSWORD}@main_db:3306/chatbot_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ADMIN_GROUP_NAME=admin
      - STAFF_GROUP_NAME=staff
      - ALLOWED_ORIGINS=https://${DOMAIN_NAME}
      - ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - ALLOWED_HEADERS=*
      - CREATE_SUPER_ADMIN=true
      - SUPER_ADMIN_EMAIL=${ADMIN_EMAIL}
      - SUPER_ADMIN_USERNAME=${ADMIN_USERNAME}
      - SUPER_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SUPER_ADMIN_FIRST_NAME=${ADMIN_FIRST_NAME}
      - SUPER_ADMIN_LAST_NAME=${ADMIN_LAST_NAME}
    depends_on:
      main_db:
        condition: service_healthy
    networks:
      - app_network

  chatbot:
    build: chatbotMicroservice
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://user:${DB_PASSWORD}@main_db:3306/chatbot_db
      - AUTH_SERVICE_URL=http://auth:8000
    depends_on:
      main_db:
        condition: service_healthy
    networks:
      - app_network

  main_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=chatbot_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - app_network
    depends_on:
      - userinterface
      - chatbot
      - auth

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
